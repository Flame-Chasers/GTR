<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{DATASET_NAME_HTML}} Dataset Access</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 920px; margin: 0 auto; padding: 48px 20px; line-height: 1.55; }
    h1 { margin-bottom: 8px; }
    .button {
      display: inline-block; margin: 14px 0 28px; padding: 11px 17px;
      border: 1px solid currentColor; border-radius: 8px; color: inherit;
      text-decoration: none; font-weight: 650;
    }
    img { width: 100%; height: auto; }
    small { opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>{{DATASET_NAME_HTML}}</h1>
    <p>Dataset access page for the GTR+ project.</p>
    <a class="button" href="./dataset/">Open dataset</a>
    <img src="./dataset-visitors.svg" alt="Daily dataset access statistics">
    <p><small>The chart reports approximate daily unique visits to the tracked dataset link, not verified downloads or identified individuals.</small></p>
  </main>
</body>
</html>
